<!-- Cross-section drawing of one edge profile. Expects `edge` from src/_data/edges.js -->
<svg class="edge-profile-svg" viewBox="0 0 190 100" role="img" aria-label="{{ edge.name | escape }} edge profile diagram" style="display: block; width: 100%; height: auto;">
    <path d="{{ edge.path }}" fill="#e9dfd3" stroke="#5b4636" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
</svg>
